<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening Routinee…</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #090415;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        text-align: center;
        padding: 2rem;
      }
      .heart { font-size: 2.5rem; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
      h1 { font-size: 1.2rem; font-weight: 700; opacity: 0.9; }
      p  { font-size: 0.9rem; opacity: 0.45; }
      .store-btn {
        display: inline-block; margin-top: 0.5rem;
        background: rgba(232,74,127,0.85);
        color: #fff; font-weight: 700; font-size: 0.95rem;
        border-radius: 2rem; padding: 0.75rem 1.8rem;
        text-decoration: none;
      }
      #fallback { display: none; }
    </style>
  </head>
  <body>
    <span class="heart">💕</span>
    <h1>Opening Routinee…</h1>
    <p>You'll be connected with your partner automatically.</p>

    <div id="fallback">
      <p>App not installed? Get it here:</p>
      <a class="store-btn" id="store-link" href="#">Download Routinee</a>
    </div>

    <script>
      const params   = new URLSearchParams(window.location.search);
      const from     = params.get('from') || '';
      const deepLink = 'routinee://invite?from=' + encodeURIComponent(from);
      const isAndroid = /android/i.test(navigator.userAgent);
      const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);

      const storeLink = isAndroid
        ? 'https://play.google.com/store/apps/details?id=com.routinee.app'
        : 'https://apps.apple.com/app/routinee/id6743427447';

      document.getElementById('store-link').href = storeLink;

      // Try opening the app immediately
      window.location.href = deepLink;

      // After 2s, if the page is still visible the app is not installed — go to store
      setTimeout(() => {
        if (!document.hidden) {
          window.location.href = storeLink;
        }
      }, 2000);

      // Show fallback UI while waiting (in case user cancels)
      setTimeout(() => {
        document.getElementById('fallback').style.display = 'block';
      }, 800);
    </script>
  </body>
</html>
