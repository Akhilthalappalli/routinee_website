<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Routinee — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .reset-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        position: relative;
        overflow: hidden;
      }
      .reset-card {
        width: min(420px, 100%);
        position: relative;
        z-index: 2;
      }
      .reset-brand {
        display: flex; align-items: center; justify-content: center; gap: 0.7rem;
        margin-bottom: 1.8rem; font-weight: 800; font-family: "Sora", sans-serif; font-size: 1.05rem;
      }
      .reset-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; }
      .reset-card p.lede { color: var(--muted); text-align: center; margin: 0 0 1.8rem; font-size: 0.95rem; }
      .reset-msg {
        border-radius: var(--radius-md); padding: 1rem 1.2rem; margin-top: 1rem; font-size: 0.92rem; display: none;
      }
      .reset-msg.is-error { display: block; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.35); color: #fca5b1; }
      .reset-msg.is-success { display: block; background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.35); color: #a6f2ff; }
      .reset-spinner {
        width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff; display: inline-block; animation: spin 700ms linear infinite; margin-right: 0.55rem; vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .invalid-state { text-align: center; }
      .invalid-state .icon-bubble { margin: 0 auto 1.2rem; }
    </style>
  </head>
  <body>
    <div class="reset-shell">
      <span class="hero-orb o1"></span>
      <span class="hero-orb o2"></span>
      <div class="dot-grid"></div>

      <div class="reset-card">
        <a class="reset-brand" href="index.html">
          <span class="brand-mark">R</span>
          <span>Routinee</span>
        </a>

        <div class="legal-card" id="formState">
          <h1>Reset your password</h1>
          <p class="lede">Choose a new password for your Routinee account.</p>

          <form id="resetForm" novalidate>
            <div class="form-field">
              <label for="password">New password</label>
              <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
            </div>
            <div class="form-field">
              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your new password" autocomplete="new-password" />
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Update password</button>
          </form>

          <div class="reset-msg" id="resetMsg"></div>
        </div>

        <div class="legal-card invalid-state" id="invalidState" style="display:none">
          <div class="icon-bubble" style="width:3.2rem;height:3.2rem;font-size:1.4rem;">⚠</div>
          <h1>Invalid or expired reset link.</h1>
          <p class="lede">Please request a new password reset from the Routinee app.</p>
        </div>
      </div>
    </div>

    <script>
      const APPWRITE_ENDPOINT = "https://fra.cloud.appwrite.io/v1/account/recovery";
      const APPWRITE_PROJECT = "6a23133900098ef105c0";

      const params = new URLSearchParams(window.location.search);
      const userId = params.get("userId");
      const secret = params.get("secret");

      const formState = document.getElementById("formState");
      const invalidState = document.getElementById("invalidState");
      const resetForm = document.getElementById("resetForm");
      const resetMsg = document.getElementById("resetMsg");
      const submitBtn = document.getElementById("submitBtn");

      if (!userId || !secret) {
        formState.style.display = "none";
        invalidState.style.display = "block";
      } else {
        resetForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirmPassword").value;

          resetMsg.className = "reset-msg";
          resetMsg.textContent = "";

          if (password.length < 8) {
            resetMsg.classList.add("is-error");
            resetMsg.textContent = "Password must be at least 8 characters.";
            return;
          }
          if (password !== confirmPassword) {
            resetMsg.classList.add("is-error");
            resetMsg.textContent = "Passwords do not match.";
            return;
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="reset-spinner"></span>Updating…';

          try {
            const res = await fetch(APPWRITE_ENDPOINT, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "X-Appwrite-Project": APPWRITE_PROJECT,
              },
              body: JSON.stringify({ userId, secret, password }),
            });

            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              throw new Error(data.message || "Something went wrong. Please try again.");
            }

            resetForm.style.display = "none";
            resetMsg.classList.add("is-success");
            resetMsg.textContent = "Password updated! You can now sign in to the Routinee app.";
          } catch (err) {
            resetMsg.classList.add("is-error");
            resetMsg.textContent = err.message || "Something went wrong. Please try again.";
            submitBtn.disabled = false;
            submitBtn.textContent = "Update password";
          }
        });
      }
    </script>
  </body>
</html>
